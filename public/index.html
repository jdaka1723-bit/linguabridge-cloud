<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1746a2">
<title>LinguaBridge - Language Translator</title>

<style>
:root {
    --blue: #1746a2;
    --blue-dark: #103780;
    --blue-light: #eaf1ff;
    --page: #f3f6fc;
    --text: #17243b;
    --muted: #64748b;
    --border: #dbe3ef;
    --white: #ffffff;
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
}

header {
    position: relative;
    overflow: hidden;
    padding: 34px 18px 38px;
    background: linear-gradient(135deg, #103780, #2463cf);
    color: var(--white);
    text-align: center;
}

header::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    right: -90px;
    top: -130px;
    border: 35px solid #ffffff15;
    border-radius: 50%;
    pointer-events: none;
}

header h1 {
    position: relative;
    z-index: 1;
    margin: 0 0 8px;
    font-size: clamp(27px, 5vw, 36px);
    font-weight: 800;
    letter-spacing: -1px;
}

header p {
    position: relative;
    z-index: 1;
    margin: 0;
    color: #e4edff;
    font-size: 15px;
}

main {
    width: 100%;
    max-width: 800px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    padding: clamp(18px, 4vw, 30px);
    background: var(--white);
    border: 1px solid #e7ecf5;
    border-radius: var(--radius);
    box-shadow: 0 12px 35px #18386b0d;
}

.languages {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

select {
    min-width: 0;
    flex: 1;
    padding: 14px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fbfcff;
    color: var(--text);
    font: inherit;
    font-size: 14px;
}

button {
    min-height: 44px;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 11px;
    padding: 11px 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    transition: background-color 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease;
    -webkit-tap-highlight-color: transparent;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 3px solid #8bb5ff;
    outline-offset: 2px;
}

.swap {
    flex: 0 0 46px;
    width: 46px;
    min-height: 46px;
    padding: 0;
    border: 1px solid #d7e4ff;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    font-size: 23px;
}

.swap:hover {
    background: #dbe7ff;
}

label {
    display: block;
    margin: 16px 0 9px;
    font-size: 14px;
    font-weight: 750;
}

textarea {
    display: block;
    width: 100%;
    min-height: 165px;
    resize: vertical;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: #fcfdff;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.65;
    transition: border-color 0.18s ease,
                box-shadow 0.18s ease;
}

textarea::placeholder {
    color: #94a0b3;
}

textarea:focus,
select:focus {
    border-color: #80a8f7;
    outline: none;
    box-shadow: 0 0 0 3px #dce8ff;
}

.counter {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
}

.tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 14px 0 20px;
}

.tools button {
    background: #edf2fb;
    color: #29466f;
}

.tools button:hover {
    background: #dfe9fb;
}

#mic {
    background: #e7efff;
    color: var(--blue);
}

#clear {
    background: #f1f4f9;
    color: #4b5d75;
}

.primary {
    display: block;
    width: 100%;
    min-height: 54px;
    padding: 15px 20px;
    border-radius: 12px;
    background: var(--blue);
    color: var(--white);
    font-size: 16px;
    box-shadow: 0 5px 12px #1746a225;
}

.primary:hover {
    background: var(--blue-dark);
}

.primary:active,
button:active {
    transform: translateY(1px);
}

.result {
    margin-top: 28px;
}

.result h3 {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
}

#output {
    min-height: 165px;
    background: #f4f7ff;
    border-color: #dce6fa;
}

#copy {
    background: #e8f0ff;
    color: var(--blue);
}

#listen {
    background: #e8f7ef;
    color: #176b42;
}

.status {
    min-height: 24px;
    margin-top: 14px;
    overflow-wrap: anywhere;
    color: #365477;
    font-size: 13px;
    line-height: 1.6;
}

.notice {
    margin-top: 20px;
    padding: 15px 16px;
    border: 1px solid #dbe8ff;
    border-radius: 12px;
    background: #f0f6ff;
    color: #29466f;
    font-size: 13px;
    line-height: 1.7;
}

footer {
    padding: 22px 15px 28px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

@media (min-width: 700px) {
    main {
        margin-top: 38px;
    }

    .card {
        padding: 32px;
    }
}

@media (max-width: 480px) {
    header {
        padding: 28px 14px 32px;
    }

    main {
        margin: 20px auto;
        padding: 0 12px;
    }

    .card {
        padding: 16px;
        border-radius: 15px;
    }

    .languages {
        gap: 7px;
        margin-bottom: 22px;
    }

    select {
        padding: 12px 5px;
        font-size: 12px;
    }

    .swap {
        flex-basis: 38px;
        width: 38px;
        min-height: 38px;
        font-size: 20px;
    }

    textarea,
    #output {
        min-height: 145px;
        padding: 13px;
        font-size: 15px;
    }

    .tools {
        gap: 8px;
    }

    .tools button {
        padding: 10px 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}
/* Translation result improvements */
.result {
  margin-top: 26px;
  padding-top: 8px;
}

.result h3 {
  color: #1746a2;
  font-size: 22px;
  margin-bottom: 14px;
}

#output {
  width: 100%;
  background: #f3f7ff;
  border: 1px solid #dbe3ef;
  border-radius: 14px;
  color: #17243b;
  line-height: 1.7;
  min-height: 160px;
  padding: 16px;
}

.result .tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.result .tools button {
  background: #eaf1ff;
  color: #1746a2;
  border: 1px solid #dbe3ef;
  border-radius: 10px;
  font-weight: 600;
  padding: 12px 18px;
}

.result .tools button:active {
  background: #d5e4ff;
}
</style></head>
<body>

<header>
    <h1>🌐 LinguaBridge</h1>
    <p>Break language barriers. Connect with the world.</p>
</header>

<main>
    <section class="card">

        <div class="languages">
            <select id="source">
                <option value="auto">Detect language</option>
                <option value="en">English</option>
                <option value="sn">Shona</option>
                <option value="nd">Ndebele</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="pt">Portuguese</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="sw">Swahili</option>
                <option value="ar">Arabic</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="ja">Japanese</option>
                <option value="ru">Russian</option>
            </select>

            <button type="button" id="swap" class="swap"
                    aria-label="Swap languages">⇄</button>

            <select id="target">
                <option value="sn">Shona</option>
                <option value="nd">Ndebele</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="pt">Portuguese</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="sw">Swahili</option>
                <option value="ar">Arabic</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="ja">Japanese</option>
                <option value="ru">Russian</option>
            </select>
        </div>

        <label for="input">Text to translate</label>
        <textarea id="input" maxlength="5000"
            placeholder="Type or speak the text you want to translate..."></textarea>

        <div class="counter" id="counter">0 / 5000 characters</div>

        <div class="tools">
            <button type="button" id="mic">🎙️ Speak</button>
            <button type="button" id="clear">✕ Clear</button>
        </div>

        <button type="button" id="translate" class="primary">
            Translate
        </button>

        <section class="result">
            <h3>Translation</h3>

            <textarea id="output" readonly
                placeholder="Your translation will appear here..."></textarea>

            <div class="tools">
                <button type="button" id="copy">📋 Copy</button>
                <button type="button" id="listen">🔊 Listen</button>
            </div>
        </section>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <div class="notice">
            Translate text between languages, use your microphone to speak,
            and listen to translated text aloud. Maximum 5,000 characters.
        </div>

    </section>
</main>

<footer>
    LinguaBridge · Connecting people through language
</footer>

<script>
(function () {
    "use strict";

    const source = document.getElementById("source");
    const target = document.getElementById("target");
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const translateButton = document.getElementById("translate");
    const micButton = document.getElementById("mic");
    const clearButton = document.getElementById("clear");
    const swapButton = document.getElementById("swap");
    const copyButton = document.getElementById("copy");
    const listenButton = document.getElementById("listen");
    const counter = document.getElementById("counter");
    const status = document.getElementById("status");

    const languageNames = {
        auto: "Detected language",
        en: "English",
        sn: "Shona",
        nd: "Ndebele",
        fr: "French",
        es: "Spanish",
        pt: "Portuguese",
        de: "German",
        it: "Italian",
        sw: "Swahili",
        ar: "Arabic",
        zh: "Chinese",
        hi: "Hindi",
        ja: "Japanese",
        ru: "Russian"
    };

    const speechLocales = {
        en: "en-US",
        sn: "sn",
        nd: "nd",
        fr: "fr-FR",
        es: "es-ES",
        pt: "pt-PT",
        de: "de-DE",
        it: "it-IT",
        sw: "sw-KE",
        ar: "ar-SA",
        zh: "zh-CN",
        hi: "hi-IN",
        ja: "ja-JP",
        ru: "ru-RU"
    };

    function setStatus(message) {
        status.textContent = message;
    }

    function updateCounter() {
        counter.textContent = input.value.length + " / 5000 characters";
    }

    input.addEventListener("input", updateCounter);

    translateButton.addEventListener("click", async function () {
        const text = input.value.trim();

        if (!text) {
            setStatus("Please enter some text to translate.");
            input.focus();
            return;
        }

        if (text.length > 5000) {
            setStatus("Text must not exceed 5,000 characters.");
            return;
        }

        if (source.value !== "auto" && source.value === target.value) {
            setStatus("Please choose two different languages.");
            return;
        }

        translateButton.disabled = true;
        translateButton.textContent = "Translating...";
        output.value = "";
        setStatus("Translating. Please wait...");

        try {
            const response = await fetch("/api/translate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    q: text,
                    source: source.value,
                    target: target.value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Translation service returned an error."
                );
            }

            if (!data.translatedText) {
                throw new Error("The translation service returned no text.");
            }

            output.value = data.translatedText;
            setStatus(
                "Translation complete: " +
                (languageNames[source.value] || "Source") +
                " → " + languageNames[target.value] + "."
            );

        } catch (error) {
            setStatus("Translation failed: " + error.message);
        } finally {
            translateButton.disabled = false;
            translateButton.textContent = "Translate";
        }
    });

    swapButton.addEventListener("click", function () {
        if (source.value === "auto") {
            setStatus("Choose a source language before swapping.");
            return;
        }

        const oldSource = source.value;
        source.value = target.value;
        target.value = oldSource;

        const oldInput = input.value;
        input.value = output.value;
        output.value = oldInput;

        updateCounter();
        setStatus("Languages swapped.");
    });

    clearButton.addEventListener("click", function () {
        input.value = "";
        output.value = "";
        updateCounter();
        setStatus("");
        input.focus();
    });

    copyButton.addEventListener("click", async function () {
        if (!output.value) {
            setStatus("There is no translation to copy yet.");
            return;
        }

        try {
            await navigator.clipboard.writeText(output.value);
            setStatus("Translation copied.");
        } catch (error) {
            output.focus();
            output.select();

            try {
                const copied = document.execCommand("copy");
                setStatus(copied
                    ? "Translation copied."
                    : "Please select and copy the translation manually.");
            } catch (copyError) {
                setStatus("Please select and copy the translation manually.");
            }
        }
    });

    listenButton.addEventListener("click", function () {
        if (!output.value.trim()) {
            setStatus("Translate some text first.");
            return;
        }

        if (!("speechSynthesis" in window)) {
            setStatus("Speech playback is not supported by this browser.");
            return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(output.value);
        utterance.lang = speechLocales[target.value] || target.value;

        utterance.onstart = function () {
            setStatus("Playing translated speech...");
        };

        utterance.onend = function () {
            setStatus("Finished playing translation.");
        };

        utterance.onerror = function () {
            setStatus("Could not play speech. Try another language.");
        };

        window.speechSynthesis.speak(utterance);
    });

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        micButton.addEventListener("click", function () {
            const recognition = new SpeechRecognition();

            recognition.lang = speechLocales[source.value] || "en-US";
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micButton.disabled = true;
            setStatus("Listening... Please speak now.");

            recognition.onresult = function (event) {
                input.value = event.results[0][0].transcript;
                updateCounter();
                setStatus("Speech captured. Tap Translate when ready.");
            };

            recognition.onerror = function (event) {
                setStatus("Microphone error: " + event.error +
                    ". Check microphone permission and try again.");
            };

            recognition.onend = function () {
                micButton.disabled = false;
            };

            try {
                recognition.start();
            } catch (error) {
                micButton.disabled = false;
                setStatus("Could not start the microphone. Please try again.");
            }
        });
    } else {
        micButton.addEventListener("click", function () {
            setStatus(
                "Voice input is not supported in this browser. Try Chrome."
            );
        });
    }

    updateCounter();
})();
</script>

</body>
</html>
