
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinguaBridge - Language Translator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6fc;color:#18243a;font-family:Arial,sans-serif}
header{background:#1746a2;color:white;padding:24px 18px;text-align:center}
header h1{margin:0 0 8px;font-size:29px}
header p{margin:0;color:#e1eaff}
main{max-width:760px;margin:24px auto;padding:0 15px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #17345b12}
.languages{display:flex;align-items:center;gap:10px;margin-bottom:16px}
select{min-width:0;flex:1;padding:12px 6px;border:1px solid #ccd5e3;border-radius:9px;background:white;font-size:14px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:bold}
.swap{background:#e8efff;color:#1746a2;padding:12px}
textarea{width:100%;min-height:155px;resize:vertical;padding:15px;border:1px solid #ccd5e3;border-radius:12px;font:16px Arial;line-height:1.5}
textarea:focus,select:focus{outline:2px solid #8cb2ff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.tools button{background:#eaf0fa;color:#203b68}
.primary{width:100%;background:#1746a2;color:white;padding:16px;font-size:17px}
.primary:disabled{opacity:.6}
.result{margin-top:18px}
.result h3{margin:0 0 10px}
#output{min-height:120px;background:#f8faff;overflow-wrap:anywhere}
.status{font-size:14px;line-height:1.5;color:#53647e;min-height:22px;margin:10px 0}
footer{text-align:center;color:#69778d;font-size:13px;padding:24px}
@media(max-width:420px){.languages{gap:5px}.swap{padding:10px 12px}select{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>🌐 LinguaBridge</h1>
<p>Break language barriers. Connect with the world.</p>
</header>
<main>
<section class="card">
<div class="languages">
<select id="source" aria-label="Translate from">
<option value="auto">Detect language</option>
<option value="en" selected>English</option>
<option value="sn">Shona</option>
<option value="nd">Ndebele</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="pt">Portuguese</option>
<option value="de">German</option>
<option value="it">Italian</option>
<option value="sw">Swahili</option>
<option value="ar">Arabic</option>
<option value="zh">Chinese</option>
<option value="hi">Hindi</option>
<option value="ja">Japanese</option>
<option value="ru">Russian</option>
</select>
<button class="swap" id="swap" title="Swap languages">⇄</button>
<select id="target" aria-label="Translate to">
<option value="sn">Shona</option>
<option value="nd">Ndebele</option>
<option value="en">English</option>
<option value="fr">French</option>
<option value="es" selected>Spanish</option>
<option value="pt">Portuguese</option>
<option value="de">German</option>
<option value="it">Italian</option>
<option value="sw">Swahili</option>
<option value="ar">Arabic</option>
<option value="zh">Chinese</option>
<option value="hi">Hindi</option>
<option value="ja">Japanese</option>
<option value="ru">Russian</option>
</select>
</div>
<textarea id="input" maxlength="5000" placeholder="Type or speak the text you want to translate..." aria-label="Text to translate"></textarea>
<div style="display:flex;justify-content:space-between;gap:10px;color:#69778d;font-size:12px;margin-top:7px">
<span>Maximum 5,000 characters</span><span id="count">0 / 5000</span>
</div>
<div class="tools">
<button id="mic">🎙️ Speak</button>
<button id="clear">✕ Clear</button>
</div>
<button class="primary" id="translate">Translate text</button>
<p class="status" id="status" role="status">Ready to translate. An internet connection is required.</p>
<div class="result">
<h3>Translation</h3>
<textarea id="output" readonly placeholder="Your translation will appear here..." aria-label="Translated text"></textarea>
<div class="tools">
<button id="copy">📋 Copy translation</button>
<button id="listen">🔊 Listen</button>
</div>
</div>
</section>
</main>
<footer>LinguaBridge · Connecting people through language</footer>
<script>
const $=id=>document.getElementById(id);
const input=$("input"),output=$("output"),status=$("status");
input.addEventListener("input",()=>{$("count").textContent=input.value.length+" / 5000"});
$("clear").onclick=()=>{input.value="";output.value="";$("count").textContent="0 / 5000";status.textContent="Text cleared.";speechSynthesis.cancel()};
$("swap").onclick=()=>{
if($("source").value==="auto"){status.textContent="Choose a source language before swapping.";return}
const old=$("source").value;
$("source").value=$("target").value;
$("target").value=old;
if(output.value){input.value=output.value;output.value="";$("count").textContent=input.value.length+" / 5000"}
};
$("translate").onclick=async()=>{
const q=input.value.trim();
if(!q){status.textContent="Please enter or speak some text first.";return}
if($("source").value===$("target").value){status.textContent="Choose two different languages.";return}
$("translate").disabled=true;
status.textContent="Translating…";
try{
const response=await fetch("/api/translate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q,source:$("source").value,target:$("target").value,format:"text"})
});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Translation service unavailable.");
if(!data.translatedText)throw new Error("No translation was returned.");
output.value=data.translatedText;
status.textContent="Translation complete.";
}catch(error){
status.textContent="Translation failed: "+error.message+" Check the cloud server and translation API settings.";
}finally{$("translate").disabled=false}
};
$("copy").onclick=async()=>{
if(!output.value){status.textContent="There is no translation to copy.";return}
try{await navigator.clipboard.writeText(output.value);status.textContent="Translation copied."}
catch(e){output.focus();output.select();status.textContent="Select the translation and use Copy."}
};
$("listen").onclick=()=>{
if(!output.value){status.textContent="Translate some text first.";return}
if(!("speechSynthesis" in window)){status.textContent="Speech output is not supported by this browser.";return}
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(output.value);
const langMap={sn:"sn-ZW",nd:"nd-ZW",en:"en-US",fr:"fr-FR",es:"es-ES",pt:"pt-PT",de:"de-DE",it:"it-IT",sw:"sw",ar:"ar-SA",zh:"zh-CN",hi:"hi-IN",ja:"ja-JP",ru:"ru-RU"};
u.lang=langMap[$("target").value]||$("target").value;
u.onerror=()=>{status.textContent="Speech could not be played. Check your device's text-to-speech settings."};
speechSynthesis.speak(u);
status.textContent="Playing translated speech…";
};
$("mic").onclick=()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){status.textContent="Voice input is not supported in this browser. Try Chrome.";return}
const recognition=new SR();
recognition.lang=$("source").value==="auto"?"en-US":({"en":"en-US","sn":"sn-ZW","nd":"nd-ZW","fr":"fr-FR","es":"es-ES","pt":"pt-PT","de":"de-DE","it":"it-IT","sw":"sw","ar":"ar-SA","zh":"zh-CN","hi":"hi-IN","ja":"ja-JP","ru":"ru-RU"}[$("source").value]||$("source").value);
recognition.interimResults=false;
recognition.onstart=()=>status.textContent="Listening… Speak now.";
recognition.onresult=e=>{
input.value=e.results[0][0].transcript;
$("count").textContent=input.value.length+" / 5000";
status.textContent="Speech captured. Tap Translate text.";
};
recognition.onerror=e=>{status.textContent="Microphone error: "+e.error+". Check browser microphone permission and try again."};
recognition.onend=()=>{};
try{recognition.start()}catch(e){status.textContent="Could not start the microphone. Please try again."}
};
</script>
</body>
</html>
