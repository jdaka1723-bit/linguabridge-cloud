<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1746a2">
<title>LinguaBridge - Language Translator</title>

<style>
:root {
    --blue: #1746a2;
    --blue-dark: #103780;
    --blue-light: #eaf1ff;
    --page: #f3f6fc;
    --text: #17243b;
    --muted: #64748b;
    --border: #dbe3ef;
    --white: #ffffff;
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
}

header {
    position: relative;
    overflow: hidden;
    padding: 34px 18px 38px;
    background: linear-gradient(135deg, #103780, #2463cf);
    color: var(--white);
    text-align: center;
}

header::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    right: -90px;
    top: -130px;
    border: 35px solid #ffffff15;
    border-radius: 50%;
    pointer-events: none;
}

header h1 {
    position: relative;
    z-index: 1;
    margin: 0 0 8px;
    font-size: clamp(27px, 5vw, 36px);
    font-weight: 800;
    letter-spacing: -1px;
}

header p {
    position: relative;
    z-index: 1;
    margin: 0;
    color: #e4edff;
    font-size: 15px;
}

main {
    width: 100%;
    max-width: 800px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    padding: clamp(18px, 4vw, 30px);
    background: var(--white);
    border: 1px solid #e7ecf5;
    border-radius: var(--radius);
    box-shadow: 0 12px 35px #18386b0d;
}

.languages {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

select {
    min-width: 0;
    flex: 1;
    padding: 14px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fbfcff;
    color: var(--text);
    font: inherit;
    font-size: 14px;
}

button {
    min-height: 44px;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 11px;
    padding: 11px 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    transition: background-color 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease;
    -webkit-tap-highlight-color: transparent;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 3px solid #8bb5ff;
    outline-offset: 2px;
}

.swap {
    flex: 0 0 46px;
    width: 46px;
    min-height: 46px;
    padding: 0;
    border: 1px solid #d7e4ff;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    font-size: 23px;
}

.swap:hover {
    background: #dbe7ff;
}

label {
    display: block;
    margin: 16px 0 9px;
    font-size: 14px;
    font-weight: 750;
}

textarea {
    display: block;
    width: 100%;
    min-height: 165px;
    resize: vertical;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: #fcfdff;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.65;
    transition: border-color 0.18s ease,
                box-shadow 0.18s ease;
}

textarea::placeholder {
    color: #94a0b3;
}

textarea:focus,
select:focus {
    border-color: #80a8f7;
    outline: none;
    box-shadow: 0 0 0 3px #dce8ff;
}

.counter {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
}

.tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 14px 0 20px;
}

.tools button {
    background: #edf2fb;
    color: #29466f;
}

.tools button:hover {
    background: #dfe9fb;
}

#mic {
    background: #e7efff;
    color: var(--blue);
}

#clear {
    background: #f1f4f9;
    color: #4b5d75;
}

.primary {
    display: block;
    width: 100%;
    min-height: 54px;
    padding: 15px 20px;
    border-radius: 12px;
    background: var(--blue);
    color: var(--white);
    font-size: 16px;
    box-shadow: 0 5px 12px #1746a225;
}

.primary:hover {
    background: var(--blue-dark);
}

.primary:active,
button:active {
    transform: translateY(1px);
}

.result {
    margin-top: 28px;
}

.result h3 {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
}

#output {
    min-height: 165px;
    background: #f4f7ff;
    border-color: #dce6fa;
}

#copy {
    background: #e8f0ff;
    color: var(--blue);
}

#listen {
    background: #e8f7ef;
    color: #176b42;
}

.status {
    min-height: 24px;
    margin-top: 14px;
    overflow-wrap: anywhere;
    color: #365477;
    font-size: 13px;
    line-height: 1.6;
}

.notice {
    margin-top: 20px;
    padding: 15px 16px;
    border: 1px solid #dbe8ff;
    border-radius: 12px;
    background: #f0f6ff;
    color: #29466f;
    font-size: 13px;
    line-height: 1.7;
}

footer {
    padding: 22px 15px 28px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

@media (min-width: 700px) {
    main {
        margin-top: 38px;
    }

    .card {
        padding: 32px;
    }
}

@media (max-width: 480px) {
    header {
        padding: 28px 14px 32px;
    }

    main {
        margin: 20px auto;
        padding: 0 12px;
    }

    .card {
        padding: 16px;
        border-radius: 15px;
    }

    .languages {
        gap: 7px;
        margin-bottom: 22px;
    }

    select {
        padding: 12px 5px;
        font-size: 12px;
    }

    .swap {
        flex-basis: 38px;
        width: 38px;
        min-height: 38px;
        font-size: 20px;
    }

    textarea,
    #output {
        min-height: 145px;
        padding: 13px;
        font-size: 15px;
    }

    .tools {
        gap: 8px;
    }

    .tools button {
        padding: 10px 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}
</style>
